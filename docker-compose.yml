version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: postgres_container
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loan
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
